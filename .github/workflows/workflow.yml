name: Builds and tests Workflow
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v2
      - name: Setup PMG proxy
        id: pmg-setup
        uses: safedep/pmg@v1
        with:
          server-mode: true
          api-key: ${{ secrets.PMG_PUBLIC_REPOS_TOKEN }}
          tenant-id: ${{ secrets.PMG_TENANT_ID }}
      - name: npm install
        run: npm ci
      - name: npm eslint
        run: npm run lint
      - name: Enforce PMG policy
        if: always()
        run: |
          if [ "${{ steps.pmg-setup.outcome }}" = "success" ]; then
            pmg proxy stop --fail-on-violation
          else
            pmg proxy stop || true
          fi
